name: Deploy to GitHub Pages

# Triggers: every push to main, plus manual re-deploys via the Actions tab.
on:
    push:
        branches: [main]
    workflow_dispatch:

# GitHub Pages needs these elevated permissions on the workflow's temporary
# GITHUB_TOKEN — default token is read-only.
permissions:
    contents: read
    pages: write
    id-token: write

# Allow one concurrent deployment. `cancel-in-progress: false` matches
# GitHub's own Pages template — we want in-flight deploys to finish instead
# of being killed mid-upload (which can leave orphan artifacts that trip up
# the next run's `deploy-pages` step with "multiple artifacts found").
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        env:
            # Reading github context into env first so we never interpolate
            # context values directly into shell `run:` blocks (avoids the
            # script-injection class of issues).
            REPO_NAME: ${{ github.event.repository.name }}
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - run: npm ci

            # VITE_BASE defaults to the repo name so a project-page URL works
            # without any extra config. Override by setting the `VITE_BASE`
            # repo secret to "/" when moving to a custom domain.
            - name: Build
              env:
                  VITE_BASE: /${{ env.REPO_NAME }}/
                  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
                  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
              run: npm run build

            # Unique artifact name per attempt. Without this, clicking
            # "Re-run failed jobs" uploads a second artifact with the same
            # name as the first attempt's, and deploy-pages chokes on the
            # duplicate. The default name would be "github-pages"; we suffix
            # it with run_attempt (1, 2, 3…) so re-runs are always clean.
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: dist
                  name: github-pages-${{ github.run_attempt }}

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
              with:
                  artifact_name: github-pages-${{ github.run_attempt }}
